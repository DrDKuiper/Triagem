# Testes, página no GitHub Pages e APK Android.
# Em pull requests só testa e compila; no main também publica o site e o APK.
name: Publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pyodide-${{ hashFiles('scripts/construir_site.py', 'app/triagem/*.py', 'app/schemas.py', 'app/config.py') }}
          restore-keys: pyodide-
      - name: Gerar o site estático
        run: |
          pip install -r requirements.txt  # para pré-calcular web/instantaneo.json
          python scripts/construir_site.py _site
      - name: Testar no navegador (o backend roda no Pyodide)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8080 --directory _site &
          python scripts/testar_site.py http://localhost:8080/ --screenshot tela.png --exigir-modelo-pronto
      - name: Testar a versão do APK no navegador, sem acesso à internet
        run: |
          python scripts/construir_site.py _app --app
          python -m http.server 8081 --directory _app &
          python scripts/testar_site.py http://localhost:8081/ --offline --screenshot tela-app.png --exigir-modelo-pronto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-de-tela
          path: |
            tela.png
            tela-app.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [testes, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pyodide-${{ hashFiles('scripts/construir_site.py', 'app/triagem/*.py', 'app/schemas.py', 'app/config.py') }}
          restore-keys: pyodide-
      - uses: gradle/actions/setup-gradle@v4
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upatriagem.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upatriagem.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o secret ANDROID_KEYSTORE_BASE64: o APK será assinado com a chave de debug."
          fi
      - name: Dependências do backend (respostas pré-calculadas do site)
        run: pip install -r requirements.txt
      - name: Compilar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          VERSAO_CODIGO: ${{ github.run_number }}
          VERSAO_NOME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :web:assembleRelease --no-daemon
          cp web/build/outputs/apk/release/web-release.apk "$GITHUB_WORKSPACE/HealthFlow.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthFlow-apk
          path: HealthFlow.apk
      - name: Habilitar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar o APK num emulador sem internet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/testar_apk.sh HealthFlow.apk apk.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-do-apk
          path: apk.png
          if-no-files-found: ignore
      - name: Publicar na release "app-android"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android --cleanup-tag --yes || true
          gh release create app-android HealthFlow.apk --target "$GITHUB_SHA" --latest \
            --title "HealthFlow — app Android 1.0.${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir de $GITHUB_SHA. Instale no celular Android (permita instalar de fontes desconhecidas). O Python e as bibliotecas vêm dentro do APK: funciona sem internet (só o mapa precisa de conexão)."
